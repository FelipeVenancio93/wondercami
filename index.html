<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060a1a">
<meta name="description" content="WonderCami — arcade de plataformas: Cami cruza la costa brasilera en moto tirando botellas de vino para rescatar a Rosita.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WonderCami">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<title>WonderCami</title>
</head>
<body>

<div id="stage">
  <canvas id="game" width="400" height="192"></canvas>
</div>

<div id="ui">
  <div class="pad">
    <button id="bLeft"  class="btn dir" aria-label="Izquierda">◀</button>
    <button id="bRight" class="btn dir" aria-label="Derecha">▶</button>
  </div>
  <div class="acts">
    <button id="bFire" class="btn act fire" aria-label="Tirar botella">
      <span class="lbl">BOTELLA</span>
    </button>
    <button id="bJump" class="btn act jump" aria-label="Saltar">
      <span class="lbl">SALTAR</span>
    </button>
  </div>
  <div class="sys">
    <button id="mute" class="mini" aria-label="Sonido">♪</button>
    <button id="full" class="mini" aria-label="Pantalla completa">⛶</button>
  </div>
</div>

<div id="rotate">
  <div class="rot-inner">
    <div class="phone"></div>
    <p>GIRÁ EL CELULAR</p>
    <small>WonderCami se juega en horizontal</small>
  </div>
</div>

<div id="loading">CARGANDO…</div>

<script src="js/pixel.js"></script>
<script src="js/font.js"></script>
<script src="js/sprites.js"></script>
<script src="js/audio.js"></script>
<script src="js/levels.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
